<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INTSEC - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(0, 200, 255, 0.07);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00c8ff, #0066ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text span:first-child {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .logo-text span:last-child {
      font-size: 11px;
      color: rgba(0, 200, 255, 0.7);
      letter-spacing: 0.5px;
    }

    h2 {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: rgba(0, 200, 255, 0.5);
      background: rgba(0, 200, 255, 0.05);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .error-msg {
      display: none;
      color: #ff4d6d;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.2);
      border-radius: 8px;
    }

    .error-msg.show {
      display: block;
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #00c8ff, #0066ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.99);
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
    }

    .footer span {
      color: rgba(0, 200, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon">🛡️</div>
      <div class="logo-text">
        <span>INTSEC</span>
        <span>AI-Enhanced Cyberattack Classifier</span>
      </div>
    </div>

    <h2>Sign In</h2>
    <p class="subtitle">Enter your credentials to continue.</p>

    <div class="error-msg" id="errorMsg">Invalid username or password.</div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="off" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button onclick="login()">Sign In</button>

    <div class="footer">
      INTSEC &copy; 2026 &nbsp;|&nbsp; <span>localhost:5601</span>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'intsec' && password === 'intsec123') {
        window.location.href = 'http://' + window.location.hostname + ':5601';
      } else {
        errorMsg.classList.add('show');
        document.getElementById('password').value = '';
      }
    }
  </script>
</body>
</html>
