<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INTSEC - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a0f1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(0, 200, 255, 0.07);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00c8ff, #0066ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text span:first-child {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .logo-text span:last-child {
      font-size: 11px;
      color: rgba(0, 200, 255, 0.7);
      letter-spacing: 0.5px;
    }

    h2 {
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: rgba(0, 200, 255, 0.5);
      background: rgba(0, 200, 255, 0.05);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .error-msg {
      display: none;
      color: #ff4d6d;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.2);
      border-radius: 8px;
    }

    .error-msg.show {
      display: block;
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #00c8ff, #0066ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.99);
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      color: rgba(255, 255, 255, 0.2);
      font-size: 12px;
    }

    .footer span {
      color: rgba(0, 200, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="card">
    <div class="logo">
      <svg width="56" height="67" viewBox="0 0 400 480" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#00d4ff"/>
          </linearGradient>
          <linearGradient id="lv" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#00d4ff"/>
          </linearGradient>
          <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect width="400" height="480" rx="24" fill="#0a0e1a"/>
        <rect width="400" height="480" rx="24" fill="none" stroke="#1a2540" stroke-width="1.5"/>
        <path d="M40 200 C40 200 120 76 200 76 C280 76 360 200 360 200 C360 200 280 324 200 324 C120 324 40 200 40 200 Z" fill="#0e1525" stroke="url(#lg)" stroke-width="3.5"/>
        <circle cx="200" cy="200" r="84" fill="#0b1220" stroke="url(#lg)" stroke-width="2.5"/>
        <path d="M200 200 L200 116 A84 84 0 0 1 284 200 Z" fill="#0066ff" opacity="0.2"/>
        <path d="M200 200 L284 200 A84 84 0 0 1 200 284 Z" fill="#00d4ff" opacity="0.2"/>
        <path d="M200 200 L200 284 A84 84 0 0 1 116 200 Z" fill="#0066ff" opacity="0.15"/>
        <path d="M200 200 L116 200 A84 84 0 0 1 200 116 Z" fill="#00d4ff" opacity="0.15"/>
        <line x1="200" y1="116" x2="200" y2="284" stroke="url(#lv)" stroke-width="1.2" opacity="0.5"/>
        <line x1="116" y1="200" x2="284" y2="200" stroke="url(#lg)" stroke-width="1.2" opacity="0.5"/>
        <circle cx="200" cy="116" r="9" fill="#0e1525" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
        <circle cx="284" cy="200" r="9" fill="#0e1525" stroke="#0066ff" stroke-width="2.5" filter="url(#glow)"/>
        <circle cx="200" cy="284" r="9" fill="#0e1525" stroke="#00d4ff" stroke-width="2.5" filter="url(#glow)"/>
        <circle cx="116" cy="200" r="9" fill="#0e1525" stroke="#0066ff" stroke-width="2.5" filter="url(#glow)"/>
        <line x1="40" y1="200" x2="116" y2="200" stroke="url(#lg)" stroke-width="1.5" opacity="0.4"/>
        <line x1="284" y1="200" x2="360" y2="200" stroke="url(#lg)" stroke-width="1.5" opacity="0.4"/>
        <path d="M56 176 L40 200 L56 224" stroke="#0066ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
        <path d="M344 176 L360 200 L344 224" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
        <rect x="160" y="206" width="80" height="60" rx="10" fill="url(#lg)"/>
        <path d="M176 206 L176 186 C176 168 224 168 224 186 L224 206" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="200" cy="232" r="9" fill="#0a0e1a"/>
        <rect x="195.5" y="232" width="9" height="16" rx="2.5" fill="#0a0e1a"/>
        <text x="200" y="386" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2" text-anchor="middle"><tspan fill="#f0f6ff">INT</tspan><tspan fill="#00d4ff">SEC</tspan></text>
        <text x="200" y="422" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="4" text-anchor="middle" fill="#3a4d6e">INTELLIGENT SECURITY</text>
      </svg>
      <div class="logo-text">
        <span>INTSEC</span>
        <span>AI-Enhanced Cyberattack Classifier</span>
      </div>
    </div>

    <h2>Sign In</h2>
    <p class="subtitle">Enter your credentials to continue.</p>

    <div class="error-msg" id="errorMsg">Invalid username or password.</div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="off" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <button onclick="login()">Sign In</button>

    <div class="footer">
      INTSEC &copy; 2026 &nbsp;|&nbsp; <span>localhost:5601</span>
    </div>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });

    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      if (username === 'intsec' && password === 'intsec123') {
        window.location.href = 'http://' + window.location.hostname + ':5601';
      } else {
        errorMsg.classList.add('show');
        document.getElementById('password').value = '';
      }
    }
  </script>
</body>
</html>
